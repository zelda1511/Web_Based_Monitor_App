name: Release build

# Actions are pinned to a commit (a moving tag could be hijacked); Dependabot proposes updates to them.

# Builds the Windows zip on every version tag (v*) and on demand.
# Signing: the SignPath step is off until the project is approved by SignPath Foundation
# and the secrets/ids below exist. Until then the zip is unsigned.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # only to create the draft Release on a version tag
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:main
      - run: npm test -- --watch=false
      # Edits the exe's product name/version (SignPath requires them); not done on the dev PC, where winCodeSign cannot unpack.
      - run: npx ng build
      # bash, because PowerShell splits -c.win... at the dot and electron-builder then reads it as a config file path.
      - run: npx electron-builder --win zip portable nsis --publish never -c.win.signAndEditExecutable=true
        shell: bash
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: upload-unsigned
        with:
          name: unsigned-zip
          path: |
            release/*.zip
            release/*.exe

      # Turn this on after SignPath approval: set the repository variable SIGNPATH_ENABLED to true,
      # the secret SIGNPATH_API_TOKEN, and replace the three ids below with the ones SignPath gives you.
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 'REPLACE_WITH_ORGANIZATION_ID'
          project-slug: 'REPLACE_WITH_PROJECT_SLUG'
          signing-policy-slug: 'release-signing'
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        with:
          name: signed-zip
          path: signed/*

      # On a version tag: a DRAFT Release with the zip attached. Nothing is public until you press Publish on GitHub.
      # While the SignPath step is off this zip is unsigned (Smart App Control will block it); once signing is on,
      # attach the signed zip from the 'signed' folder instead.
      - name: Draft GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/*.zip release/*.exe --draft --verify-tag --title "Webase System Monitor ${TAG#v}"             --notes "Three downloads: the Setup .exe installs the app (with an uninstaller), the Portable .exe runs without installing, and the zip holds the unpacked app (run Webase System Monitor.exe). Not code-signed yet, so Windows Smart App Control or SmartScreen may block it. Free code signing provided by SignPath.io, certificate by SignPath Foundation (pending approval: this build is not signed yet)."
