<div class="shell">
  <header class="top">
    <div class="brand" title="Webase System Monitor">
      <app-icon name="processes" />
      <span class="wordmark" aria-hidden="true">WEBASE</span>
      <span class="visually-hidden">Webase System Monitor</span>
    </div>

    <button
      type="button"
      class="jump"
      (click)="palette().toggle()"
      aria-label="Go to page (Ctrl+K)"
      title="Go to page (Ctrl+K)"
    >
      <app-icon name="search" /><span>Jump to page</span><kbd>Ctrl K</kbd>
    </button>

    <div class="appearance">
      <span class="visually-hidden" id="theme-label">Appearance</span>
      <div class="theme" role="group" aria-labelledby="theme-label">
        @for (m of modes; track m.id) {
          <button
            type="button"
            [attr.aria-pressed]="theme.mode() === m.id"
            [attr.aria-label]="m.label"
            [title]="m.label"
            (click)="theme.set(m.id)"
          >
            <app-icon [name]="m.icon" />
          </button>
        }
      </div>
    </div>
  </header>

  <div class="body">
    <aside class="side">
      <nav class="sections" aria-label="Sections">
        @for (s of sections; track s.id) {
          <a
            class="section"
            [routerLink]="target(s)"
            [class.active]="current().id === s.id"
            [attr.aria-current]="current().id === s.id ? 'true' : null"
            >{{ s.label }}</a
          >
          @if (current().id === s.id && s.pages.length > 1) {
            <div class="pages" role="group" [attr.aria-label]="s.label + ' pages'">
              @for (p of s.pages; track p.path) {
                <a
                  [routerLink]="p.path"
                  routerLinkActive="active"
                  ariaCurrentWhenActive="page"
                  [routerLinkActiveOptions]="{ exact: true }"
                  >{{ p.label }}</a
                >
              }
            </div>
          }
        }
      </nav>
    </aside>

    <main>
      <router-outlet />
    </main>
  </div>
</div>
<app-ui-host />
<app-palette [items]="paletteItems" />
